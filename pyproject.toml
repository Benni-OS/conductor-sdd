[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conductor-sdd"
version = "0.1.0"
description = "Zero-Dependency Spec-Driven Development (SDD) Harness, AST Drift Detector & MCP Guardrail for Autonomous AI Coding Agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Benni Alencar", email = "bennialencar@benni-os.net" },
]
keywords = [
  "ai-agents",
  "spec-driven-development",
  "sdd",
  "ast",
  "mcp",
  "cursor",
  "claude-code",
  "anti-drift",
  "static-analysis",
  "benni-os",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6.0",
]
yaml = [
  "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://benni-os.net"
Repository = "https://github.com/Benni-OS/conductor-sdd"
Documentation = "https://benni-os.net/blog/en/spec-driven-development-eliminating-ai-code-drift-formal-consensus.html"

[project.scripts]
conductor = "conductor_sdd.cli:main"
conductor-sdd = "conductor_sdd.cli:main"
conductor-mcp = "conductor_sdd.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["conductor_sdd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]
